[project]
name = "onaar-backend"
version = "0.1.0"
description = "FastAPI backend for YOUR BRAND / Onaar e-commerce platform with Supabase PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.12",
    "aiosmtplib>=3.0.2",
    "jinja2>=3.1.4",
    "httpx>=0.27.2",
]

[tool.uv]
package = false
